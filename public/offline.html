<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | AnantSoftComputing</title>
    <meta name="theme-color" content="#4a6596" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f8fafc;
      }
      main {
        width: min(88vw, 420px);
        padding: 28px;
        border: 1px solid #dbe3f0;
        border-radius: 20px;
        background: white;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #4b5563; line-height: 1.6; }
      a {
        display: inline-flex;
        margin-top: 20px;
        min-height: 44px;
        align-items: center;
        padding: 0 16px;
        border-radius: 12px;
        background: #4a6596;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>AnantSoft is installed, but this page is not cached yet. Reconnect and try again.</p>
      <a href="/">Go home</a>
    </main>

</html>
